# 타임캡슐(루트 index.html)과 레벨업 앱(/levelup/)을 함께 GitHub Pages에 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: levelup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: levelup/package-lock.json
      - run: npm ci
      - run: npm run build
      # 사이트 구성: / = 타임캡슐, /levelup/ = 레벨업 앱
      - name: Assemble site
        working-directory: .
        run: |
          mkdir -p _site/levelup
          cp index.html _site/
          cp -r levelup/dist/. _site/levelup/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
